<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <th:block th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">

    <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" th:href="@{/css/style.css}">
      <!-- BootStrapのCSSの読み込み -->
      <link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
      <!-- jQueryの読み込み -->
      <script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
      <!-- BootStrapのJSの読み込み -->
      <script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
      <title>新規ユーザー登録</title>
    </head>

    <body>
      <h1>利用者登録</h1>
      <form class="form" th:action="@{${UrlConsts.REGISTER_GENERAL_USER} + '/regist'}" th:method="POST"
        th:object="${form}">
        <div class="formItem">
          <label>利用者ID</label>
          <span th:text="*{generalUserId}"></span>
            <input type="hidden" th:field="*{generalUserId}">
        </div>
        <div class="formItem">
          <label>氏名</label>
          <input type="text" th:field="*{name}">
        </div>
        <div class="formItem">
          <label>フリガナ</label>
          <input type="text" th:field="*{nameKana}">
        </div>
        <div class="formItem">
          <label>生年月日</label>
          <input type="date" th:field="*{birthday}">
        </div>
        <div class="formItem">
          <label>電話番号</label>
          <input type="text" th:field="*{phoneNumber}">
        </div>
        <div class="formItem">
          <label>住所</label>
          <input type="text" th:field="*{addres}">
        </div>
        <div class="formItem">
          <a type="submit" th:href="@{${UrlConsts.SEARCH_BOOK}}">キャンセル</a>
        </div>
        <div class="formItem">
          <button type="submit">登録</button>
        </div>
      </form>
    </body>

</html>
