<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <th:block th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">

    <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" th:href="@{/css/style.css}">
      <!-- BootStrapのCSSの読み込み -->
      <link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
      <!-- jQueryの読み込み -->
      <script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
      <!-- BootStrapのJSの読み込み -->
      <script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
      <title>新規職員登録</title>
    </head>

    <body>
      <h1>新規職員登録</h1>
      <form class="form" th:action="@{${UrlConsts.REGISTER_STAFF_USER}}" th:method="POST" th:object="${form}">
        <div class="formItem">
          <label for="loginId">職員番号</label>
          <input type="text" th:field="*{staffUserId}">
        </div>
        <div class="formItem">
          <label for="password">パスワード</label>
          <input type="password" th:field="*{password}">
        </div>
        <div class="formItem">
          <label for="confirmPassword">再確認</label>
          <input type="password" th:field="*{confirmPassword}">
        </div>
        <div class="formItem">
          <label for="email">メールアドレス</label>
          <input type="email" th:field="*{email}">
        </div>
        <div class="formItem">
          <label for="name">氏名</label>
          <input type="text" th:field="*{name}">
        </div>
        <div class="formItem">
          <label for="nameKana">氏名かな</label>
          <input type="text" th:field="*{nameKana}">
        </div>
        <div class="formItem">
          <button type="submit">登録</button>
        </div>
      </form>
    </body>

</html>
