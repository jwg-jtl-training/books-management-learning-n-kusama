<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- BootStrapのCSSの読み込み -->
    <link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQueryの読み込み -->
    <script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
    <!-- BootStrapのJSの読み込み -->
    <script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
    <title>図書検索結果</title>
  </head>

  <body>
    <h1>図書検索</h1>
    <form class="form" th:action="@{${UrlConsts.SEARCH_BOOK_RESULT} + '/search'}" th:method="POST" th:object="${form}">
     <div>
       <input type="text" th:field="*{title}" placeholder="#{hello.welcome}">
     </div>
     <div>
       <button type="submit">検索</button>
     </div>
   </form>
   <h1>検索結果</h1>
   <hr>
   <table class="table">
     <tr>
       <th>タイトル</th>
       <th>著者</th>
       <th>出版社</th>
       <th>ISBN</th>
       <th>ジャンル</th>
    </tr>
    <th:block th:each="book : ${result}" th:object="${book}">
      <tr>
        <td th:text="*{title}"></td>
        <td th:text="*{author}"></td>
        <td th:text="*{publisher}"></td>
        <td th:text="*{isbn}"></td>
        <td th:text="*{genreDto.genreName}"></td>
      </tr>
    </th:block>
   </table>
   <a th:href="@{${UrlConsts.SEARCH_BOOK}}">TOPに戻る</a>
  </body>
</html>
