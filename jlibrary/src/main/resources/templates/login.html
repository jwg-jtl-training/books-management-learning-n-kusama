<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- BootStrapのCSSの読み込み -->
    <link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQueryの読み込み -->
    <script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
    <!-- BootStrapのJSの読み込み -->
    <script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
    <title>ログイン</title>
  </head>

  <body>
    <a th:href="@{${UrlConsts.REGISTER_STAFF_USER}}">新規登録</a>
    <h1>ログインページ</h1>
    <p th:if="${param.error}" class="error">
        ユーザー名またはパスワードが違います。
    </p>

    <form class="form" th:action="@{${UrlConsts.LOGIN}}" th:method="POST">
     <div>
       <label for="loginId">ログインID</label>
       <input type="text" name="username">
     </div>
     <div>
       <label for="password">パスワード</label>
       <input type="password" name="password">
     </div>
     <div>
       <button type="submit">ログイン</button>
     </div>
   </form>
  </body>
</html>
