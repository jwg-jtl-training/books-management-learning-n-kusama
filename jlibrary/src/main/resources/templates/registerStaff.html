<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block
	th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">
	<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">
<!-- BootStrapのCSSの読み込み -->
<link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- jQueryの読み込み -->
<script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
<!-- BootStrapのJSの読み込み -->
<script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
<title>職員登録</title>
<script th:inline="javascript">
	function confirmMessage() {
		var checkRegisterFlg = confirm("登録してもよろしいですか？");

		if (checkRegisterFlg) {
			sessionStorage.setItem('key', 'registeredSUser');
		} else {
			alert("登録をキャンセルしました");
			return checkRegisterFlg;
		}
	}

	function removeValue() {
		sessionStorage.removeItem('key')
	}

	window.onload = removeValue()
</script>
	</head>
	<body>
		<section class="vh-100 gradient-custom">
			<div class="container py-5 h-100">
				<div class="row justify-content-center align-items-center h-100">
					<div class="col-12 col-lg-9 col-xl-7">
						<div class="card shadow-2-strong card-registration"
							style="border-radius: 15px;">
							<div class="card-body p-4 p-md-5">
								<h3
									class="mb-4 pb-2 pb-md-0 mb-md-5 fst-italic fw-bold text-decoration-underline">職員登録</h3>
								<form class="form"
									th:action="@{${UrlConsts.REGISTER_STAFF_USER}}"
									th:method="POST" th:object="${form}">
									<div class="formItem">
										<div class="col-12 mb-2">
											<div class="form-outline w-100">
												<label for="loginId"
													class="fs-5 pb-2 text-decoration-underline text-muted">職員番号</label><br>
												<input type="hidden" th:field="*{staffUserId}">
												<p class="p-2 fs-2">
													<mark th:text="*{staffUserId}"></mark>
												</p>
												<span th:text="#{userIdMessage}"></span>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6 mb-4">
											<div class="formItem">
												<label for="name">氏名</label> <input type="text"
													class="form-control form-control-lg" th:field="*{name}">
												<span class="text-danger"
													th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
											</div>
										</div>
										<div class="col-md-6 mb-4">
											<div class="formItem">
												<label for="nameKana">氏名(カナ)</label> <input type="text"
													class="form-control form-control-lg" th:field="*{nameKana}">
												<span class="text-danger"
													th:if="${#fields.hasErrors('nameKana')}"
													th:errors="*{nameKana}"></span>
											</div>
										</div>
									</div>
									<div class="formItem">
										<div class="col-12 mb-4">
											<div class="form-outline w-100">
												<label for="email">メールアドレス</label> <input type="email"
													class="form-control form-control-lg w-100"
													th:field="*{email}"> <span class="text-danger"
													th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6 mb-4 pb-2">
											<div class="formItem">
												<label for="password">パスワード</label> <input type="password"
													placeholder="********" class="form-control form-control-lg"
													th:field="*{password}"> <span class="text-danger"
													th:if="${#fields.hasErrors('password')}"
													th:errors="*{password}"></span>
											</div>
										</div>
										<div class="col-md-6 mb-4 pb-2">
											<div class="formItem">
												<label for="confirmPassword">パスワード(確認用)</label> <input
													type="password" placeholder="********"
													class="form-control form-control-lg"
													th:field="*{confirmPassword}"> <span
													class="text-danger"
													th:if="${#fields.hasErrors('confirmPassword')}"
													th:errors="*{confirmPassword}"></span>
											</div>
										</div>
									</div>
									<div class="formItem">
										<div class="mt-4 pt-2">
											<input class="btn btn-primary btn-lg" type="submit"
												value="登録" onclick="return confirmMessage()" /> <a
												type="submit" class="btn btn-primary btn-lg"
												th:href="@{${UrlConsts.SEARCH_BOOK}}">キャンセル</a>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</body>
</html>
