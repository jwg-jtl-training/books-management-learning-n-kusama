<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block
	th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">
	<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">
<!-- BootStrapのCSSの読み込み -->
<link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- jQueryの読み込み -->
<script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
<!-- BootStrapのJSの読み込み -->
<script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
<script th:inline="javascript">
	var data = sessionStorage.getItem('key');
	if (data == 'registeredBook')
		alert("図書の登録が完了しました。");
	sessionStorage.removeItem('key')
</script>
<title>図書検索</title>

	</head>

	<body class="bg-warning-subtle">
		<ul class="text-end list-unstyled list-inline h5 pt-4 pe-4">
			<li class="list-inline-item"><a sec:authorize="hasRole('ADMIN')"
				th:href="@{${UrlConsts.LOGOUT}}" class="text-decoration-none">ログアウトA</a></li>
			<li class="list-inline-item"><a sec:authorize="hasRole('STAFF')"
				th:href="@{${UrlConsts.LOGOUT}}" class="text-decoration-none">ログアウトS</a></li>
			<li class="list-inline-item"><a
				sec:authorize="hasRole('GENERAL')" th:href="@{${UrlConsts.LOGOUT}}"
				class="text-decoration-none">ログアウトG</a></li>

			<li class="list-inline-item"><a sec:authorize="hasRole('STAFF')"
				th:href="@{${UrlConsts.STAFF_USER_LIST}}"
				class="text-decoration-none">職員一覧S</a></li>
			<li class="list-inline-item"><a sec:authorize="hasRole('STAFF')"
				th:href="@{${UrlConsts.GENERAL_USER_LIST}}"
				class="text-decoration-none">利用者一覧S</a></li>
			<li class="list-inline-item"><a sec:authorize="hasRole('STAFF')"
				th:href="@{${UrlConsts.REGISTER_BOOK}}" class="text-decoration-none">図書登録S</a></li>
		</ul>

		<section class="h-auto gradient-custom">
			<div class="container py-5 h-75">
				<div class="row justify-content-center align-items-center h-25">
					<div class="col-12 col-lg-9 col-xl-7">
						<div class="card-body p-4 p-md-5">
							<h1
								class="mb-4 pb-2 pb-md-0 mb-md-5 fst-italic fw-bold text-center">本を探す</h1>
							<form class="form"
								th:action="@{${UrlConsts.SEARCH_BOOK} + '/search'}"
								th:method="POST" th:object="${form}">
								<div>
									<input type="text" th:field="*{keyword}"
										th:placeholder="探している本のタイトルまたは著者名を入力してください"
										class="form-control form-control-lg border-dark mb-5">
								</div>
								<div class="text-center">
									<button type="submit" class="btn btn-primary btn-lg">検索</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</section>

	</body>
</html>
