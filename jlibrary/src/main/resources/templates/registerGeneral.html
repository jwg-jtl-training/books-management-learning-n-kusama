<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:with="UrlConsts=${T(jp.co.jwebgate.jlibrary.consts.UrlConsts)}">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- BootStrapのCSSの読み込み -->
    <link href="/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQueryの読み込み -->
    <script src="/jquery-3.7.1/jquery-3.7.1.min.js"></script>
    <!-- BootStrapのJSの読み込み -->
    <script src="/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
    <title>新規ユーザー登録</title>
  </head>

  <body>
    <section class="vh-100 gradient-custom">
      <div class="container py-5 h-100">
        <div class="row justify-content-center align-items-center h-100">
          <div class="col-12 col-lg-9 col-xl-7">
            <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
              <div class="card-body p-4 p-md-5">
                <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 fst-italic fw-bold text-decoration-underline">利用者登録</h3>
                <form class="form" th:action="@{${UrlConsts.REGISTER_GENERAL_USER} + '/regist'}" th:method="POST" th:object="${form}">
                  <div class="formItem">
                    <div class="col-12 mb-2">
                      <div class="form-outline w-100">
                        <label class="fs-5 text-decoration-underline text-muted">利用者ID</label>
                        <span th:text="*{generalUserId}"></span>
                        <input type="hidden" th:field="*{generalUserId}" class="p-2 f-2">
                      </div>
                    </div>
                  </div>
        
                  <div class="row">
                    <div class="col-md-6 mb-4">
                      <div class="formItem">
                        <label>氏名</label>
                        <input type="text" class="form-control form-control-lg" th:field="*{name}">
                      </div>
                    </div>
                    <div class="col-md-6 mb-4">
                      <div class="formItem">
                        <label>氏名(カナ)</label>
                        <input type="text" class="form-control form-control-lg" th:field="*{nameKana}">
                      </div>
                    </div>
                  </div>
                  
                  <div class="formItem">
                    <div class="col-12 mb-4">
                      <div class="form-outline w-100">
                        <label>生年月日</label>
                        <input type="date" class="form-control form-control-lg w-100" th:field="*{birthday}">
                      </div>
                    </div>
                  </div>
        
                  <div class="formItem">
                    <div class="col-12 mb-4">
                      <div class="form-outline w-100">
                        <label>メールアドレス</label>
                        <input type="email" class="form-control form-control-lg w-100" th:field="*{email}">
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-4 pb-2">        
                      <div class="formItem">
                        <label for="password">パスワード</label>
                        <input type="password" class="form-control form-control-lg"  placeholder="********" th:field="*{password}">
                      </div>
                    </div>
                    <div class="col-md-6 mb-4 pb-2">   
                      <div class="formItem">
                        <label for="confirmPassword">パスワード(確認用)</label>
                        <input type="password" class="form-control form-control-lg"  placeholder="********" th:field="*{confirmPassword}">
                      </div>
                    </div>
                  </div>
        
                  <div class="row">
                    <div class="formItem">
                      <div class="mt-4 pt-2">
                        <a type="submit" class="btn btn-primary btn-lg"th:href="@{${UrlConsts.SEARCH_BOOK}}">キャンセル</a>
                        <input class="btn btn-primary btn-lg" onclick="return confirm('登録してもよろしいですか？')" type="submit" value="登録" />
                      </div>
                    </div>
                  </div>     
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    
  </body>
</html>
