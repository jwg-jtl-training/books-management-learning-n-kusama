<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- BootStrapのCSSの読み込み -->
  <link href="../../lib/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQueryの読み込み -->
  <script src="../../lib/jquery-3.7.1/jquery-3.7.1.min.js"></script>
  <!-- BootStrapのJSの読み込み -->
  <script src="../../lib/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
  <title>図書利用者一覧</title>
</head>

<body>
  
  <div class="container py-5 h-75">
	
	<ul class="text-end list-unstyled list-inline h5 pt-4 pe-4">
	  <li class="list-inline-item"><a href="#" class="text-decoration-none">利用者登録</a></li>
    </ul>
	  
	<h2 class="pb-3">図書利用者一覧</h2>
	<table class="table border-dark" style="table-layout:fixed;width:110%;">
      <thead>
	    <tr class="h5">
		  <th>利用者ID</th>
		  <th>氏名 (カナ)</th>
		  <th>生年月日</th>
		  <th>電話番号</th>
		  <th>住所</th>
      <th></th>
      <th></th>
		</tr>
	  </thead>
	  
	  <tbody>
	    <tr class="text-break">
		    <td>0001</td>
        <td>山田太郎 (ヤマダタロウ)</td>
        <td>1980/05/01</td>
        <td>08000000001</td>
        <td>東京都中央区XXXX</td>
        <td class="text-end">
          <a href="#" class="text-decoration-none">編集</a>
        </td>
        <td>
          <form class="form" action="#" method="GET">
            <input type="submit" class="btn btn-primary btn-sm" onclick="return confirm('削除してもよろしいですか？')" value="削除">
          </form> 
        </td>
	    </tr>
	  </tbody>
	</table>
	
	<div class="mt-4 pt-2">
		<div class="text-end">
			<input class="btn btn-primary btn-lg" type="submit" value="TOPに戻る" />
        </div>
	</div>
  </div>
 	
</body>

</html>
