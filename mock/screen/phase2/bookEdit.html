<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- BootStrapのCSSの読み込み -->
  <link href="../../lib/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQueryの読み込み -->
  <script src="../../lib/jquery-3.7.1/jquery-3.7.1.min.js"></script>
  <!-- BootStrapのJSの読み込み -->
  <script src="../../lib/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
  <title>図書編集</title>
</head>

<body>
    <section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
      <div class="row justify-content-center align-items-center h-100">
        <div class="col-12 col-lg-9 col-xl-7">
          <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
            <div class="card-body p-4 p-md-5">
              <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 fst-italic fw-bold text-decoration-underline">図書編集</h3>
              <form class="form" action="#" method="POST">

                <div class="row">
                  <div class="col-12 mb-4">
                    <div class="form-outline w-100">
                      <input type="text" class="form-control form-control-lg" />
                      <label class="form-label" for="title">タイトル</label>
                    </div>
                  </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-4">
                      <div class="form-outline w-100">
                        <input type="text" class="form-control form-control-lg w-100" />
                        <label class="form-label" for="author">著者</label>
                      </div>
                    </div>
                  </div>

                <div class="row">
                  <div class="col-md-6 mb-4 pb-2">
                    <div class="form-outline">
                      <input type="text" class="form-control form-control-lg"  />
                      <label class="form-label" for="ISBN10">ISBN-10</label>
                    </div>
                  </div>
                  <div class="col-md-6 mb-4 pb-2">
                    <div class="form-outline">
                      <input type="text" class="form-control form-control-lg" />
                      <label class="form-label" for="ISBN13">ISBN-13</label>
                    </div>
                  </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-4">
                      <div class="form-outline w-100">
                        <input type="email" class="form-control form-control-lg w-100" />
                        <label class="form-label" for="publisher">出版社</label>
                      </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-10 mb-4 pb-2">
                      <div class="form-outline">
                        <input type="text" id="genre" class="form-control form-control-lg" readonly />
                        <label class="form-label" for="genre">ジャンル</label>
                      </div>
                    </div>
                    <div class="col-md-2 mb-4 pb-2">
                      <div class="mt-1">
                        <button class="btn btn-info" type="button" data-bs-toggle="modal" data-bs-target="#genreModal">設定</button>
                      </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-5 mb-4 pb-2">
                      <div class="form-outline">
                        <input type="text" class="form-control form-control-lg"  />
                        <label class="form-label" for="shelf-number">棚番号</label>
                      </div>
                    </div>
                    <div class="col-md-7 mb-4 pb-2">
                        <div class="row">
                            <div class="col-md-9 mb-4 pb-2">
                                <div class="form-outline">
                                  <input id="id" type="text" class="form-control form-control-lg"  />
                                  <label class="form-label" for="id">管理番号</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-4 pb-2">
                                <div class="mt-1">
                                  <button class="btn btn-info" type="button" onclick="generate()">生成</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="mt-4 pt-2 text-end">
                    <button type="button" class="btn btn-lg btn-info">戻る</button>
                    <input  class="btn btn-primary btn-lg"
                        onclick="return confirm('登録してもよろしいですか？')" type="submit" value="編集" />
                </div>
                </div>
              </form>

              <!-- modal -->
              <div class="modal modal-lg fade"  id="genreModal" tabindex="-1" role="dialog" aria-labelledby="genreModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title" id="genreModalLabel">ジャンルを選択してください。</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                      <div class="bg-info bg-gradient">
                        <span>
                          <input class="form-check-input" id="00" type="radio"  name="genre" value="00 総記"/>
                          <label class="form-check-label" for="00">00 総記</label>
                        </span>
                      </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="01" type="radio"  name="genre" value="01 図書館. 図書館学"/>
                        <label class="form-check-label" for="01">01 図書館. 図書館学</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="02" type="radio" name="genre" value="02 図書. 書誌学"/>
                        <label class="form-check-label" for="02">02 図書. 書誌学</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="03" type="radio" name="genre" value="03 百科事典"/>
                        <label class="form-check-label" for="03">03 百科事典</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="04" type="radio" name="genre" value="04 一般論文集. 一般講演集"/>
                        <label class="form-check-label" for="04">04 一般論文集. 一般講演集</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="05" type="radio" name="genre" value="05 逐次刊行物"/>
                        <label class="form-check-label" for="05">05 逐次刊行物</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="06" type="radio" name="genre" value="06 団体"/>
                        <label class="form-check-label" for="06">06 団体</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="07" type="radio" name="genre" value="07 ジャーナリズム. 新聞"/>
                        <label class="form-check-label" for="07">07 ジャーナリズム. 新聞</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="08" type="radio" name="genre" value="08 叢書. 全集. 選集"/>
                        <label class="form-check-label" for="08">08 叢書. 全集. 選集</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="09" type="radio" name="genre" value="09 貴重書. 郷土資料. その他の特別コレクション"/>
                        <label class="form-check-label" for="09">09 貴重書. 郷土資料. その他の特別コレクション</label>
                      </span>
                    </div>
                    <br>

                    <div class="bg-info bg-gradient">
                      <span>
                        <input class="form-check-input" id="10" type="radio"  name="genre" value="10 哲学"/>
                        <label class="form-check-label" for="10">10 哲学</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="11" type="radio" name="genre" value="11 哲学各論"/>
                        <label class="form-check-label" for="11">11 哲学各論</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="12" type="radio" name="genre" value="12 東洋思想"/>
                        <label class="form-check-label" for="12">12 東洋思想</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="13" type="radio" name="genre" value="13 西洋哲学"/>
                        <label class="form-check-label" for="13">13 西洋哲学</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="14" type="radio" name="genre" value="14 心理学"/>
                        <label class="form-check-label" for="14">14 心理学</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="15" type="radio" name="genre" value="15 倫理学. 道徳"/>
                        <label class="form-check-label" for="15">15 倫理学. 道徳</label>
                      </span>
                    </div>

                    <div class="bg-light bg-gradient">
                      <span>
                        <input class="form-check-input" id="16" type="radio" name="genre" value="16 宗教"/>
                        <label class="form-check-label" for="16">16 宗教</label>
                      </span>
                    </div>
                  <br>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                      <button type="button" class="btn btn-primary" onClick="selectGenre()" data-bs-dismiss="modal">選択</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

<script>
function generate() {
  min = Math.ceil(0);
  max = Math.floor(99999);
  rdm = Math.floor(Math.random() * (max - min + 1) + min);
  rdmStr = rdm.toString().padStart(5,'0')
  document.getElementById("id").value ="B" + rdmStr;
}

function selectGenre(){
  let obj = $('input:radio[name="genre"]:checked');
  $('#genre').attr('value',(obj.val()))
}
</script>
</body>

</html>
