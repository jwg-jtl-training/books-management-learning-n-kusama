<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- BootStrapのCSSの読み込み -->

  <!-- jQueryの読み込み -->

  <title>職員一覧</title>
</head>

<body>
  
  <div class="container py-5 h-75">
	
	<ul class="text-end list-unstyled list-inline h5 pt-4 pe-5 me-5">
	  <li class="list-inline-item"><a href="registerStaff.html" class="text-decoration-none">職員登録</a></li>
    </ul>
	  
	<h2 class="pb-3">職員一覧</h2>
	<table class="table border-dark">
		
		
		<thead>
			<tr class="h5">
				<th>職員ID</th>
				<th>氏名（カナ）</th>
				<th>メールアドレス</th>
				<th></th>
				<th></th>
			</tr>
		</thead>
		
		<tbody>
	
	    <tr class="text-break">
		  <td>0001</td>
          <td>山田太郎（ヤマダタロウ）</td>
          <td>test@aaaa.co.jp</td>
		  

			<td class="text-end"><a href="editStaff.html" class="text-decoration-none pe-4">編集</a></td>
				
			<td>
				<form th:action="#" th:method="delete">
					<input class="btn btn-primary btn-sm" onclick="return confirm('削除してもよろしいですか?')" type="submit" value="削除"/>
				</form>
			</td>
			
	    </tr>

	  </tbody>
	</table>
	
	<div class="pt-3 me-3 pe-5">
		<div class="text-end">
			<input class="btn btn-primary btn-lg " type="submit" value="TOPに戻る" />
        </div>
	</div>
  </div>
