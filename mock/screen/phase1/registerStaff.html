<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- BootStrapのCSSの読み込み -->
  <link href="../../lib/bootstrap-5.3.0-dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQueryの読み込み -->
  <script src="../../lib/jquery-3.7.1/jquery-3.7.1.min.js"></script>
  <!-- BootStrapのJSの読み込み -->
  <script src="../../lib/bootstrap-5.3.0-dist/js/bootstrap.min.js"></script>
  <title>職員登録</title>
</head>

<body>

  <section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
      <div class="row justify-content-center align-items-center h-100">
        <div class="col-12 col-lg-9 col-xl-7">
          <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
            <div class="card-body p-4 p-md-5">
              <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 fst-italic fw-bold text-decoration-underline">職員登録</h3>
              <form class="form" action="#" method="POST">

                <div class="row">
                  <div class="col-12 mb-2">

                    <div class="form-outline w-100">
                      <span class="fs-5 text-decoration-underline text-muted">職員番号</span>
                      <p class="p-2 fs-2"><mark>S00001</mark></p>
                    </div>

                  </div>
                </div>


                <div class="row">
                  <div class="col-md-6 mb-4">

                    <div class="form-outline">
                      <input type="text" class="form-control form-control-lg" />
                      <label class="form-label" for="name">氏名</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div class="form-outline">
                      <input type="text" class="form-control form-control-lg" />
                      <label class="form-label" for="nameKana">氏名(かな)</label>
                    </div>

                  </div>
                </div>

                <div class="row">
                  <div class="col-12 mb-4">

                    <div class="form-outline w-100">
                      <input type="email" class="form-control form-control-lg w-100" />
                      <label class="form-label" for="email">メールアドレス</label>
                    </div>

                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-4 pb-2">

                    <div class="form-outline">
                      <input type="password" class="form-control form-control-lg" placeholder="********" />
                      <label class="form-label" for="password">パスワード</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4 pb-2">

                    <div class="form-outline">
                      <input type="password" class="form-control form-control-lg" placeholder="********" />
                      <label class="form-label" for="confirmPassword">パスワード(確認用)</label>
                    </div>

                  </div>
                </div>

                <div class="mt-4 pt-2">
                  <input class="btn btn-primary btn-lg" type="submit" value="Submit" />
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>

</html>
